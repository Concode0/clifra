name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"   # Mondays at 03:00 UTC
  workflow_dispatch:
    inputs:
      profile:
        description: "Hypothesis verification profile"
        required: false
        default: "standard"
        type: choice
        options:
          - standard
          - full

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MKL_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1

jobs:
  tests:
    name: Tests (${{ (github.event_name == 'schedule' || github.event.inputs.profile == 'full') && 'full' || 'standard' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HYPOTHESIS_PROFILE: ${{ (github.event_name == 'schedule' || github.event.inputs.profile == 'full') && 'full' || 'standard' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core + dev group
        run: uv sync --group dev

      - name: Run tests
        run: uv run --group dev --group viz pytest tests/ --hypothesis-profile="$HYPOTHESIS_PROFILE" -n 2 -q --tb=short
