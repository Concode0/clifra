[project]
name = "clifra"
version = "2.0.2"
description = "clifra: Layout-first Clifford algebra tools for PyTorch"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Eunkyum Kim", email = "nemonanconcode@gmail.com" },
]
keywords = [
    "geometric-algebra",
    "clifford-algebra",
    "deep-learning",
    "pytorch",
    "rotor",
    "multivector",
    "equivariant",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "setuptools",
    "torch>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/Concode0/clifra"
Repository = "https://github.com/Concode0/clifra"

[dependency-groups]
dev = [
    "hypothesis>=6.155.7",
    "pytest>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8.0",
]
docs = [
    "mkdocs<2.0",
    "mkdocs-material>=9.7.4",
    "mkdocstrings[python]>=0.30.1",
    "pymdown-extensions>=10.21",
]
viz = [
    "imageio>=2.37.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "vtk>=9.4.0",
]

[build-system]
requires = ["setuptools>=80.10.2"]
build-backend = "setuptools.build_meta"

[tool.uv]
default-groups = []

[tool.setuptools.packages.find]
include = ["clifra*"]

[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4
extend-exclude = [
    "assets",
    "data",
    "dist",
    "outputs",
    "site",
    "research"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    "E401",  # Multiple imports on one line appear in compact research/test code.
    "E402",  # Some tests set pytest marks before local imports.
    "E702",  # Compact mathematical scratch code may use semicolon-separated statements.
    "E741",  # Single-letter algebra notation is common in math-heavy code.
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "property: property-based or generated exhaustive verification",
    "integration: tests requiring external data or network access",
    "unit: fast, self-contained unit tests",
]
