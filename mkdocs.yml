site_name: clifra
site_url: https://concode0.github.io/clifra/
repo_url: https://github.com/Concode0/clifra
repo_name: Concode0/clifra

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

  palette:
      - scheme: default
        primary: deep orange
        accent: indigo
        toggle:
            icon: material/weather-night
            name: Switch to dark mode
      - scheme: slate
        primary: black
        accent: cyan
        toggle:
            icon: material/weather-sunny
            name: Switch to light mode
      
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_options:
              warn_missing_types: false
              warn_unknown_params: false
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            filters:
              - "!^_[^_]"
            show_if_no_docstring: false

nav:
  - Home: index.md
  - Tutorials:
      - Overview: tutorials/index.md
      - First Clifford Product: tutorials/first-clifford-product.md
      - Layouts, Storage, and Tensor Composition: tutorials/layouts-and-plans.md
      - Planned Differentiation: tutorials/planned-differentiation.md
      - Bivector Exponentials and Induced Actions: tutorials/exponentials-and-actions.md
      - Fit a Rotation with PyTorch: tutorials/learn-geometric-transform.md
      - Differentiate a Spatial Deformation: tutorials/unbend-manifold.md
  - How-to Guides:
      - Overview: how-to/index.md
      - Define signatures and layouts: how-to/signatures-and-layouts.md
      - Convert between compact and canonical storage: how-to/storage-conversion.md
      - Work with leading dimensions and broadcasting: how-to/broadcasting.md
      - Use pairwise operations: how-to/pairwise-operations.md
      - Plan and reuse products: how-to/products.md
      - Use unary and grade operations: how-to/unary-and-grades.md
      - Compute norms, energies, and signed forms correctly: how-to/signed-quantities.md
      - Reflect vectors and multivectors: how-to/reflections.md
      - Project, reject, and invert safely: how-to/blade-geometry.md
      - Materialize a bivector exponential: how-to/bivector-exponential.md
      - Apply a bivector-generated action without materializing the rotor: how-to/induced-actions.md
      - Compose explicit rotor operations: how-to/rotor-composition.md
      - Put planned operations inside nn.Module: how-to/modules.md
      - Compile Clifford computations: how-to/compilation.md
      - Optimize Clifford parameters: how-to/optimizer-updates.md
      - Set resource limits: how-to/resource-limits.md
      - Understand and control planned execution: how-to/planned-execution.md
      - Provide a custom executor: how-to/custom-executors.md
      - Analyze spectra, commutators, and transformations: how-to/analysis.md
      - Use experimental analysis: how-to/experimental-analysis.md
  - Explanations:
      - Overview: explanations/index.md
      - Layouts, Storage, and Tensor Contracts: explanations/layout-storage-contracts.md
      - Products, Grades, and Blade Geometry: explanations/products-and-geometry.md
      - Signatures and Algebraic Behavior: explanations/signatures-and-learning.md
      - Planned Execution and Resources: explanations/planning-policy-injection.md
      - Structural Work and Policy Calibration: explanations/structural-work-and-policy-calibration.md
      - Tensor Composition and PyTorch Ownership: explanations/clifra-and-pytorch.md
      - Geometric Representations and Parameters: explanations/clifra-methodology.md
      - Optimization and Geometric Updates: explanations/optimizer-dispatch.md
      - Bivector Exponentials and Actions: explanations/bivector-exponential.md
  - API Reference: reference/index.md
  - Research:
      - Transformation Fields: research/index.md
      - Experiments:
          - Sparse-Constraint Continuum Threading: research/sparse_continuum_threading.md
          - Continuous-Time PGA LiDAR Deskewing: research/pga-lidar-deskewing.md
          - Relativistic Beamline Inverse Design: research/relativistic-beamline.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
